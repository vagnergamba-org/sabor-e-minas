name: Pre-publicacao final
on:
  push:
    branches: [pre-publicacao-2026-10-19]
permissions:
  contents: write
jobs:
  preparar:
    if: ${{ !contains(github.event.head_commit.message, '[prepub-auto]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pre-publicacao-2026-10-19
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Otimizar imagens, auditar e gerar ZIP
        run: python tools/pre_publicacao.py
      - name: Commit das otimizacoes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!sabor-e-minas-publicacao-2026-10-19.zip'
          if ! git diff --cached --quiet; then
            git commit -m "Optimize web images and validate site [prepub-auto]"
            git push origin HEAD:pre-publicacao-2026-10-19
          fi
      - name: Guardar backup de publicacao
        uses: actions/upload-artifact@v4
        with:
          name: sabor-e-minas-publicacao-2026-10-19
          path: sabor-e-minas-publicacao-2026-10-19.zip
          if-no-files-found: error
          retention-days: 90
