name: Pacotes finais Sabor e Minas
on:
  push:
    branches: [pre-publicacao-2026-10-19]
permissions:
  contents: read
jobs:
  pacote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pre-publicacao-2026-10-19
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar pacotes finais
        run: python tools/package_final.py
      - name: Enviar pacotes
        uses: actions/upload-artifact@v4
        with:
          name: sabor-e-minas-pacotes-finais-2026-10-19
          path: |
            Sabor-e-Minas-publicacao-final-2026-10-19.zip
            Sabor-e-Minas-backup-completo-2026-10-19.zip
          if-no-files-found: error
          retention-days: 90
